name: Build unsigned iOS 27 IPA

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

# GitHub Actions already skips workflows when the commit message contains
# [skip ci], [ci skip], [no ci], [skip actions], or [actions skip].
# The job-level `if` below is an explicit, belt-and-suspenders guard.
jobs:
  build:
    name: Build electerm iOS
    runs-on: xcode-27
    timeout-minutes: 120
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[no ci]') && !contains(github.event.head_commit.message, '[skip actions]') && !contains(github.event.head_commit.message, '[actions skip]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode
        run: |
          sw_vers
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK"
          [[ "$SDK" == 27 || "$SDK" == 27.* ]] || { echo "::error::Expected iOS 27 SDK"; exit 1; }

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Ensure CocoaPods is available
        run: which pod >/dev/null 2>&1 || sudo gem install cocoapods

      - name: ci init
        run: npm config set legacy-peer-deps true

      - name: Install root dependencies (electerm + build tooling)
        run: npm i

      - name: Install Capacitor dependencies
        run: npm --prefix build/ios install

      - name: Build web frontend + Node.js backend bundle
        run: npm run build:ios

      - name: Bypass Capacitor appId validation (Apple allows dashes, Capacitor does not)
        run: |
          # Capacitor enforces Java package name rules (no dashes) even for
          # iOS-only apps. Apple's bundle ID rules are more permissive and
          # allow dashes. Patch checkAppId() to skip validation so `cap add ios`
          # accepts org.electerm.electerm-ios.
          node -e "
            const fs = require('fs');
            const p = 'build/ios/node_modules/@capacitor/cli/dist/common.js';
            let c = fs.readFileSync(p, 'utf8');
            c = c.replace(
              /async function checkAppId\(config, id\) \{[\s\S]*?\nexports\.checkAppId = checkAppId;/,
              'async function checkAppId(config, id) { return null; }\nexports.checkAppId = checkAppId;'
            );
            fs.writeFileSync(p, c);
            console.log('Patched Capacitor appId validation');
          "

      - name: Add iOS platform (first run only)
        run: |
          cd build/ios
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Sync Capacitor (copies web assets + native plugins)
        run: cd build/ios && npx cap sync ios

      - name: Apply Info.plist overlay (ATS exception for localhost)
        run: cd build/ios && node build.mjs --overlay-only

      - name: Verify native plugins are registered (Capacitor 8 SPM)
        run: |
          set -euo pipefail
          MANIFEST=$(find build/ios/ios -path '*/CapApp-SPM/Package.swift' -print -quit)
          test -n "$MANIFEST" || { echo "::error::Generated SPM manifest missing"; exit 1; }
          cat "$MANIFEST"
          grep -Eqi 'capacitor-file-sharer|CapgoCapacitorFileSharer' "$MANIFEST"
          grep -Eqi 'capacitor-nodejs|CapawesomeCapacitorNodejs' "$MANIFEST"
          echo "File sharer and on-device Node runtime registered in SPM"

      - name: Verify native download bridge is wired
        # The UI page is served by the in-app Node.js server on
        # http://127.0.0.1:5577 — NOT by Capacitor's own origin — so Capacitor
        # never injects PluginHeaders there and every Capacitor plugin silently
        # degrades to its web implementation (a no-op inside the WebView).
        # "Download to Files" therefore goes through our own WKWebView
        # message-handler bridge instead. If the overlay copy above ever
        # silently stops landing these files, the build still succeeds but
        # downloads are broken with no error, so assert they are in place.
        #
        # Same story for the window-chrome bridge (status bar / home indicator
        # colours from the UI theme): losing ElectermWindowChrome.swift gives an
        # app that builds fine but shows system-white strips around a dark theme.
        run: |
          SWIFT=build/ios/ios/App/App/ElectermSaveBridge.swift
          CHROME=build/ios/ios/App/App/ElectermWindowChrome.swift
          CONTAINER=build/ios/ios/App/App/SafeAreaContainerViewController.swift
          fail=0
          [ -f "$SWIFT" ] || {
            echo "::error::ElectermSaveBridge.swift missing at $SWIFT"; fail=1; }
          grep -q 'ElectermNative' "$CONTAINER" || {
            echo "::error::$CONTAINER does not install the ElectermNative bridge"; fail=1; }
          [ -f "$CHROME" ] || {
            echo "::error::ElectermWindowChrome.swift missing at $CHROME"; fail=1; }
          grep -q 'ElectermWindowChrome.install' "$CONTAINER" || {
            echo "::error::$CONTAINER does not install the ElectermChrome bridge"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "native download + window chrome bridges wired OK"

      - name: Resolve Swift Package Manager dependencies
        run: |
          # Capacitor 8 uses SPM (not CocoaPods): the native project is an
          # .xcodeproj, not an .xcworkspace. Resolve packages explicitly so any
          # network/resolution error surfaces here with a clear log.
          cd build/ios/ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies \
            -configuration Release

      - name: Boot iOS 27 iPhone simulator
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/simulator-logs"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sim-devices.json"
          DEVICE=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["devices"]; print(next((x["udid"] for k,v in sorted(d.items(),reverse=True) if "iOS-27" in k for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")), ""))' "$RUNNER_TEMP/sim-devices.json")
          test -n "$DEVICE" || { cat "$RUNNER_TEMP/sim-devices.json"; echo "::error::No iOS 27 iPhone simulator installed"; exit 1; }
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Compile simulator app (Release)
        run: |
          set -o pipefail
          cd build/ios/ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/electerm-simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO build \
            2>&1 | tee "$GITHUB_WORKSPACE/simulator-logs/build.log"

      - name: Launch app and verify embedded networking engine
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/electerm-simulator/Build/Products/Release-iphonesimulator/App.app"
          LOG="$GITHUB_WORKSPACE/simulator-logs"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$APP/Info.plist" | grep -Fx ElectermSceneDelegate
          xcrun simctl install "$SIM_UDID" "$APP"
          if curl -fsS --max-time 2 http://127.0.0.1:5577/ >/dev/null 2>&1; then
            echo "::error::Backend port already in use before app launch"; exit 1
          fi
          xcrun simctl launch --terminate-running-process --stdout="$LOG/app-stdout.log" --stderr="$LOG/app-stderr.log" "$SIM_UDID" "$BID" | tee "$LOG/launch.log"
          PID=$(awk '/: [0-9]+$/ {print $NF}' "$LOG/launch.log" | tail -1)
          test -n "$PID"
          READY=0
          for attempt in $(seq 1 90); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Electerm exited before its local server became ready"; exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:5577/ -o "$LOG/backend.html" && grep -qi electerm "$LOG/backend.html"; then
              READY=1; break
            fi
            sleep 2
          done
          test "$READY" = 1 || { echo "::error::Electerm backend did not become ready"; exit 1; }
          sleep 15
          kill -0 "$PID"
          curl -fsS --max-time 5 http://127.0.0.1:5577/ -o "$LOG/backend.html"
          grep -qi electerm "$LOG/backend.html"
          curl -fsS --max-time 5 http://127.0.0.1:5577/api/get-constants -o "$LOG/constants.json"
          xcrun simctl io "$SIM_UDID" screenshot --display=1 "$LOG/electerm.png" || echo "::warning::Screenshot capture failed; app process and HTTP checks passed"
          kill -0 "$PID"
          echo "Electerm stayed alive and served its UI from the embedded Node runtime"

      - name: Collect simulator diagnostics
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/simulator-logs"
          mkdir -p "$LOG"
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 15m --style compact --predicate 'process == "App" OR eventMessage CONTAINS[c] "electerm"' > "$LOG/unified.log" 2>&1 || true
            xcrun simctl io "$SIM_UDID" screenshot --display=1 "$LOG/final.png" || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f \( -name 'App*.ips' -o -name 'App*.crash' \) -mmin -30 -exec cp {} "$LOG/" \; 2>/dev/null || true
            xcrun simctl shutdown "$SIM_UDID" || true
          fi
          for file in "$LOG/app-stdout.log" "$LOG/app-stderr.log"; do
            if [ -f "$file" ]; then tail -100 "$file"; fi
          done

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electerm-simulator-diagnostics
          path: simulator-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Build iOS app (unsigned, device SDK)
        run: |
          # Capacitor scaffolds the native project at build/ios/ios/App/
          # (an .xcodeproj; the scheme is "App"). Building via the *scheme*
          # (not -target) is required so Xcode generates the
          # @capawesome/capacitor-nodejs SPM module map in the correct
          # dependency order before the App target's clang dependency scan.
          cd build/ios/ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/electerm-derived" \
            -sdk iphoneos \
            ARCHS=arm64 \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/electerm-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$APP/Info.plist" | grep -Fx ElectermSceneDelegate
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$EXEC"
          lipo -verify_arch arm64 "$APP/$EXEC"
          xcrun vtool -show-build "$APP/$EXEC"
          mkdir -p "$RUNNER_TEMP/electerm-package/Payload"
          ditto "$APP" "$RUNNER_TEMP/electerm-package/Payload/App.app"
          rm -rf "$RUNNER_TEMP/electerm-package/Payload/App.app/_CodeSignature"
          rm -f "$RUNNER_TEMP/electerm-package/Payload/App.app/embedded.mobileprovision"
          mkdir -p "$GITHUB_WORKSPACE/dist-ipa"
          cd "$RUNNER_TEMP/electerm-package"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist-ipa/electerm-ios.ipa"
          unzip -tq "$GITHUB_WORKSPACE/dist-ipa/electerm-ios.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/dist-ipa/electerm-ios.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: electerm-ios-unsigned
          path: dist-ipa/electerm-ios.ipa
          if-no-files-found: error
          retention-days: 30
